#-----------------------------------------------------------------------------
# Title      : OpenOCD configuration of the jtag_bitbang co-simulation
# Project    : Asylum
#-----------------------------------------------------------------------------
# File       : jtag.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12 connected to tb_bitbang_openocd through the
#              remote_bitbang adapter (rbb_server.c, port 9824), then the
#              checks : IDCODE (-expected-id of the scan of the chain and a DR
#              scan), DR scans of the TDR (data_o looped back to data_i),
#              TRST (data_o of the TDR cleared), SRST. Prints
#              "SCENARIO PASS" or "SCENARIO FAIL", then shutdown.
#              On a board : socat links port 4444 to the USB-UART cable,
#              replace the port and keep the adapter and TAP lines.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-22  1.0      mrosiere Created
# 2026-11-24  1.1      mrosiere check and scenario_end of rbb/check.tcl
#                               (co-simulation kit)
#-----------------------------------------------------------------------------

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 9824
transport select jtag

reset_config trst_and_srst

# jtag_tap of tb_bitbang_openocd : IR of 5 bits
jtag newtap bb tap -irlen 5 -expected-id 0x4a7c0e35

gdb_port    disabled
tcl_port    disabled
telnet_port disabled

init

# check, scenario_end : rbb/check.tcl of the co-simulation kit
source rbb/check.tcl

# IDCODE (opcode 1)
irscan bb.tap 1
check "IDCODE"               [drscan bb.tap 32 0]   0x4a7c0e35

# TDR (opcode 2) : each scan returns the data of the previous one
irscan bb.tap 2
check "TDR after the reset"  [drscan bb.tap 8 0xa5] 0x00
check "TDR, first scan"      [drscan bb.tap 8 0x3c] 0xa5
check "TDR, second scan"     [drscan bb.tap 8 0x5a] 0x3c

# TRST clears data_o of the TDR (the path of OpenOCD from Test-Logic-Reset
# to Shift-IR does not go through Test-Logic-Reset when the TAP is in
# Run-Test/Idle). After TRST, OpenOCD assumes BYPASS : IR scan first.
adapter assert   trst
adapter deassert trst
irscan bb.tap 2
check "TDR after TRST"       [drscan bb.tap 8 0x00] 0x00

# SRST : seen by the testbench
adapter assert   srst
adapter deassert srst

scenario_end
