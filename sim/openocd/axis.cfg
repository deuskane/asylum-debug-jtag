#-----------------------------------------------------------------------------
# Title      : OpenOCD configuration of the jtag_axis co-simulation
# Project    : Asylum
#-----------------------------------------------------------------------------
# File       : axis.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12 connected to tb_axis_openocd through the
#              remote_bitbang adapter (rbb_server.c of the co-simulation kit,
#              port 9824), then the procedures of tools/openocd/jtag_axis.tcl
#              (copied to openocd/) on the jtag_axis TAP, whose RX FIFO is
#              looped back to its TX FIFO by the testbench : CONFIG, empty
#              TX FIFO, words written (push) then read back (pop), FIFOs
#              full (push refused), drained, burst of 8 rounds of 4 words
#              pushed and popped back to back. Prints "SCENARIO PASS" or
#              "SCENARIO FAIL" (rbb/check.tcl of the kit), then shutdown.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-26  1.0      mrosiere Created
# 2026-11-27  1.1      mrosiere CONFIG without FIFO depth, burst
#-----------------------------------------------------------------------------

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 9824
transport select jtag

# jtag_axis of tb_axis_openocd : IR of 5 bits
jtag newtap axis tap -irlen 5 -expected-id 0x10004001

gdb_port    disabled
tcl_port    disabled
telnet_port disabled

init

# check, scenario_end : rbb/check.tcl of the co-simulation kit
source rbb/check.tcl
source openocd/jtag_axis.tcl

# IDCODE (opcode 1)
irscan axis.tap 1
check "IDCODE"                [drscan axis.tap 32 0] 0x10004001

# CONFIG : 8-bit words, both directions enabled and empty
set c [jtag_axis_config axis.tap]
check "CONFIG data_width"     [format %x [dict get $c data_width]] 0x8
check "CONFIG enables"        [format %x [expr {[dict get $c tx_enable] + 2*[dict get $c rx_enable]}]] 0x3
check "CONFIG empty"          [format %x [expr {[dict get $c tx_empty]  + 2*[dict get $c rx_empty]}]]  0x3

# Nothing to read
check "pop, empty"            [format %x [llength [jtag_axis_pop axis.tap 1]]] 0x0

# 3 words written, looped back, read back
check "push 3 words"          [format %x [jtag_axis_push axis.tap {0x11 0x22 0x33}]] 0x3
runtest 20
set hex ""
foreach w [jtag_axis_pop axis.tap 4] {
    append hex [format %02x $w]
}
check "pop 3 words"           $hex 0x112233

# The loop holds 8 words (RX FIFO, TX FIFO) : the push of 10 words stops
# on a refused word, the words written come back in order
set n [jtag_axis_push axis.tap {0xa0 0xa1 0xa2 0xa3 0xa4 0xa5 0xa6 0xa7 0xa8 0xa9}]
check "push into full FIFOs"  [format %x [expr {$n >= 8 && $n < 10}]] 0x1
runtest 20
set words [jtag_axis_pop axis.tap 10]
check "pop after full"        [format %x [llength $words]] [format 0x%x $n]
check "first word after full" [format %x [lindex $words 0]] 0xa0
check "last word after full"  [format %x [lindex $words end]] [format 0x%x [expr {0xa0 + $n - 1}]]

# Burst : 8 rounds of 4 words pushed then popped back, back to back (no
# runtest) : 32 words through the loop, in order
set sent ""
set back ""
for {set r 0} {$r < 8} {incr r} {
    set words {}
    for {set k 0} {$k < 4} {incr k} {
        lappend words [expr {(0x40 + 4*$r + $k) & 0xff}]
    }
    set n [jtag_axis_push axis.tap $words]
    foreach w [lrange $words 0 [expr {$n - 1}]] {
        append sent [format %02x $w]
    }
    foreach w [jtag_axis_pop axis.tap 4] {
        append back [format %02x $w]
    }
}
runtest 20
foreach w [jtag_axis_pop axis.tap 32] {
    append back [format %02x $w]
}
check "burst : 32 words pushed" [format %x [string length $sent]] 0x40
check "burst : words popped in order" [format %x [expr {$back eq $sent}]] 0x1

runtest 20
set c [jtag_axis_config axis.tap]
check "CONFIG empty again"    [format %x [expr {[dict get $c tx_empty] + 2*[dict get $c rx_empty]}]] 0x3

scenario_end
